name: release-audit-candidate

on:
  push:
    branches: ['audit/release-1.1.0']
    paths: ['.github/workflows/release-audit-apply.yml']

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-verified fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, bz2, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'ytvee-dev/webdev-agent-kit'
          assert os.environ['GITHUB_REF'] == 'refs/heads/audit/release-1.1.0'
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/877f7bf91a82150d89b773dc13fa0aed05de4c78', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as response:
              payload = bz2.decompress(base64.b64decode(json.load(response)['content']))
          assert hashlib.sha256(payload).hexdigest() == '5f0d27a331bbc630d38a06cf657dfa824e03f9191e16718c4e240a9c5f23a849'
          change = json.loads(payload)
          subprocess.run(['git', 'merge-base', '--is-ancestor', change['base'], 'HEAD'], check=True)
          for item in change['files']:
              path = pathlib.Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not any(p.is_symlink() for p in [path, *path.parents])
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert current == item['before_sha256'], str(path) + ': changed base'
          pathlib.Path('/tmp/release-files.json').write_text(json.dumps(change['files']))
          pathlib.Path('/tmp/release.patch').write_text(change['patch'])
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '--index', '/tmp/release.patch'], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '/tmp/release.patch'], check=True)
          pathlib.Path('.github/workflows/release-audit-apply.yml').unlink()
          PY
      - name: Install existing quality tools
        run: |
          python -m pip install ruff yamllint
          npm install --global markdownlint-cli2
      - name: Format changed files
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          files = [i['path'] for i in json.loads(pathlib.Path('/tmp/release-files.json').read_text()) if i['path'].endswith('.py')]
          subprocess.run(['ruff', 'check', '--fix', *files], check=True)
          subprocess.run(['ruff', 'format', *files], check=True)
          subprocess.run(['markdownlint-cli2', '--fix', 'CHANGELOG.md'], check=True)
          PY
      - name: Validate candidate
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_skill_pack.py 2>&1 | tee /tmp/release-validation.log
          python scripts/check_links.py 2>&1 | tee /tmp/release-links.log
          ruff check scripts skills/agent-rules-skill-author/scripts skills/project-onboarding-adapter/scripts skills/frontend-quality-reviewer/scripts 2>&1 | tee /tmp/release-ruff.log
          ruff format --check scripts skills/agent-rules-skill-author/scripts skills/project-onboarding-adapter/scripts skills/frontend-quality-reviewer/scripts 2>&1 | tee /tmp/release-format.log
          yamllint .github .codex-plugin skills/*/agents 2>&1 | tee /tmp/release-yaml.log
          markdownlint-cli2 2>&1 | tee /tmp/release-markdown.log
          git diff --check
      - name: Export validated source objects without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess, tarfile, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path, value=None):
              data = json.dumps(value).encode() if value is not None else None
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}', data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          parent = os.environ['GITHUB_SHA']
          base_tree = api('git/commits/' + parent)['tree']['sha']
          files = json.loads(pathlib.Path('/tmp/release-files.json').read_text())
          files.append({'path': '.github/workflows/release-audit-apply.yml'})
          elements = []
          for item in files:
              path = pathlib.Path(item['path'])
              sha = api('git/blobs', {'content': base64.b64encode(path.read_bytes()).decode(), 'encoding': 'base64'})['sha'] if path.exists() else None
              elements.append({'path': path.as_posix(), 'mode': '100644', 'type': 'blob', 'sha': sha})
          pathlib.Path('/tmp/release-objects.json').write_text(json.dumps({'parent_sha': parent, 'base_tree_sha': base_tree, 'tree_elements': elements}, indent=2))
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('/tmp/release-candidate.tar', 'w') as archive:
              for name in tracked:
                  if name and pathlib.Path(name).is_file():
                      archive.add(name, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate
          path: |
            /tmp/release-*.log
            /tmp/release-objects.json
            /tmp/release-candidate.tar
          retention-days: 3

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Load exact validated candidate
        run: |
          python -c "import os,tarfile; from pathlib import Path; tarfile.open(Path(os.environ['RUNNER_TEMP'])/'candidate/release-candidate.tar').extractall('.', filter='data')"
      - name: Test real Windows onboarding and journal ACLs
        run: python -m unittest discover -s scripts -p test_model_routing.py -v
      - name: Test real Windows Git review packages
        run: python -m unittest discover -s scripts -p test_review_package.py -v
