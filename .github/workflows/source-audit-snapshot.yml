name: Apply and validate GPT routing release

on:
  push:
    branches: ['audit/gpt-model-routing-v1']
    paths: ['.github/workflows/source-audit-snapshot.yml']

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'ytvee-dev/webdev-agent-kit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply exact locally tested patch
        run: |
          mkdir -p "$RUNNER_TEMP/v1-audit"
          cat .github/model-routing-patch/*.txt > "$RUNNER_TEMP/routing-v1.patch"
          echo "26d7ab7574197abd767f993ba4e3838f15283f08443b278be74d6036ce261119  $RUNNER_TEMP/routing-v1.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/routing-v1.patch"
          git apply "$RUNNER_TEMP/routing-v1.patch"
          rm -r .github/model-routing-patch
          rm .github/workflows/source-audit-snapshot.yml
      - name: Install existing CI lint tools
        run: |
          python -m pip install ruff yamllint
          npm install --global markdownlint-cli2
      - name: Format changed Python and run lint
        run: |
          set -o pipefail
          ruff check --fix scripts skills/agent-rules-skill-author/scripts skills/project-onboarding-adapter/scripts 2>&1 | tee "$RUNNER_TEMP/v1-audit/ruff-fix.log"
          ruff format scripts skills/agent-rules-skill-author/scripts skills/project-onboarding-adapter/scripts 2>&1 | tee "$RUNNER_TEMP/v1-audit/ruff-format.log"
          ruff check scripts skills/agent-rules-skill-author/scripts skills/project-onboarding-adapter/scripts 2>&1 | tee "$RUNNER_TEMP/v1-audit/ruff-check.log"
          yamllint .github .codex-plugin skills/*/agents 2>&1 | tee "$RUNNER_TEMP/v1-audit/yamllint.log"
          markdownlint-cli2 2>&1 | tee "$RUNNER_TEMP/v1-audit/markdownlint.log"
      - name: Full source, packaging and regression checks
        run: |
          set -o pipefail
          git diff --check
          git diff --exit-code -- README.md
          python scripts/validate_skill_pack.py 2>&1 | tee "$RUNNER_TEMP/v1-audit/full-validation.log"
      - name: Commit validated source on working branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: release 1.0.0 with instruction-driven GPT role routing'
          git push origin HEAD:refs/heads/audit/gpt-model-routing-v1
      - name: Export audit evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/v1-audit"
          git add -A
          git archive --format=tar "$(git write-tree)" -o "$RUNNER_TEMP/v1-audit/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/v1-audit/HEAD.txt"
          git diff --cached --stat > "$RUNNER_TEMP/v1-audit/pending-diff.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-routing-v1-audit
          path: ${{ runner.temp }}/v1-audit/
          retention-days: 3
