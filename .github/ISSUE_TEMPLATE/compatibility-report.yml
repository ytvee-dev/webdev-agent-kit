name: Client compatibility report
description: Report installation, discovery, archive, sandbox, or target-specific compatibility problems.
title: "[Compatibility]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched existing issues for this client and version.
          required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - Codex
        - Claude Code
        - Cursor
        - VS Code Codex
        - VS Code Claude
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version and archive
      placeholder: v1.6.0, webdev-agent-kit-codex.tar.gz
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, shell, client version, and installation mode.
      placeholder: Windows 11, PowerShell, Codex extension, project-root extract
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: List the expected paths, discovery result, or client behavior.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include exact errors and relevant paths.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Commands and checks
      description: List exact commands and distinguish passed, failed, blocked, and skipped checks.
    validations:
      required: true
  - type: dropdown
    id: evidence-kind
    attributes:
      label: Evidence kind
      options:
        - Observed agent run
        - Observed installation
        - Configuration snapshot
        - Synthetic replay
    validations:
      required: true
  - type: input
    id: client-model
    attributes:
      label: Client version and model
      description: Include the app or extension, its version, model, OS, and shell. Write unknown for details you cannot check.
    validations:
      required: true
  - type: textarea
    id: repetition
    attributes:
      label: Repetitions and retained evidence
      description: Say whether it happened in a new session, how often it occurred, and where the results are recorded. Separate real agent runs from simulated cases.
    validations:
      required: false
  - type: dropdown
    id: checksum
    attributes:
      label: Checksum result
      options:
        - Matched the same release SHA256SUMS
        - Mismatch
        - Could not verify
        - Not an archive installation
    validations:
      required: true
  - type: textarea
    id: installation-stage
    attributes:
      label: Installation stage and upgrade state
      description: Say whether the failure happened while extracting files, loading skills, adapting the project, or running a task. For updates, include old/new versions, the client package, preserved files, and any rollback result.
    validations:
      required: true
